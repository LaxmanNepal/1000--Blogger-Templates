name: Deploy Blogger Template Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Install browser renderer
        run: |
          python3 -m pip install --disable-pip-version-check playwright
          python3 -m playwright install --with-deps chromium

      - name: Generate static catalog
        run: python3 tools/build-catalog.py

      - name: Generate static search index
        run: python3 tools/build-search-index.py

      - name: Generate and quality-check visual snapshots
        run: python3 tools/build-thumbnails.py

      - name: Prepare minimal static site
        run: python3 tools/prepare-site.py

      - name: Validate production site and snapshot quality
        run: |
          test -f dist/index.html
          test -f dist/styles.css
          test -f dist/app-fast.js
          test -f dist/sw.js
          test -f dist/404.html
          test -f dist/manifest.webmanifest
          test -f dist/robots.txt
          test -f dist/catalog.json
          test -f dist/search-index.json
          test -f dist/generated/snapshot-report.json
          test -d dist/generated/thumbnails
          python3 - <<'PY'
          import json
          from pathlib import Path
          catalog=json.loads(Path('dist/catalog.json').read_text())
          report=json.loads(Path('dist/generated/snapshot-report.json').read_text())
          manifest=json.loads(Path('dist/manifest.webmanifest').read_text())
          assert catalog.get('templates'), 'catalog is empty'
          count=len(catalog['templates'])
          assert report.get('total') == count, f"Report covers {report.get('total')} of {count} templates"
          assert manifest.get('start_url') == './'
          assert manifest.get('display') == 'standalone'
          real=report.get('real_snapshots',0)
          fallback=report.get('fallback_snapshots',0)
          assets=list(Path('dist/generated/thumbnails').glob('*.jpg'))+list(Path('dist/generated/thumbnails').glob('*.svg'))
          assert len(assets) >= count, f'Only {len(assets)} snapshot assets for {count} templates'
          minimum=int(count*0.95)
          assert real >= minimum, f'Only {real}/{count} real snapshots; need at least {minimum}'
          print(f'Validated {count} templates: {real} real snapshots, {fallback} fallbacks; PWA metadata OK')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
