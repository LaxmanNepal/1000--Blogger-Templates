name: Deploy Blogger Template Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with LFS objects
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Generate static catalog
        run: python3 tools/build-catalog.py

      - name: Generate static search index
        run: python3 tools/build-search-index.py

      - name: Generate lightweight static thumbnails
        run: python3 tools/build-thumbnails.py

      - name: Prepare minimal static site
        run: python3 tools/prepare-site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site only
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
